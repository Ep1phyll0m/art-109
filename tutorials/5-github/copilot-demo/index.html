<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Strip - Adventure Time</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>COMIC STRIP</h1>
        <p class="subtitle">An Epic Adventure</p>
    </header>

    <main>
        <div class="comic-container">
            <!-- Panel 1 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <img class="panel-bg" src="images/panel-1.png" alt="Panel 1: Adventure begins">
                </div>
                <div class="speech-bubble">
                    <p>Wow! What an amazing day for adventure!</p>
                </div>
            </div>

            <!-- Panel 2 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <img class="panel-bg" src="images/panel-2.png" alt="Panel 2: Joining the adventure">
                </div>
                <div class="speech-bubble">
                    <p>I'm coming with you!</p>
                </div>
            </div>

            <!-- Panel 3 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <img class="panel-bg" src="images/panel-3.png" alt="Panel 3: Danger ahead">
                </div>
                <div class="speech-bubble">
                    <p>Oh my! A giant crab!</p>
                </div>
            </div>

            <!-- Panel 4 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <img class="panel-bg" src="images/panel-4.png" alt="Panel 4: Victory">
                </div>
                <div class="speech-bubble">
                    <p>We're all friends now!</p>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-btn" id="prevBtn">← Previous</button>
            <span class="panel-counter"><span id="currentPanel">1</span> / 4</span>
            <button class="nav-btn" id="nextBtn">Next →</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Comic Strip Adventures. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
