<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Strip - Adventure Time</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>COMIC STRIP</h1>
        <p class="subtitle">An Epic Adventure</p>
    </header>

    <main>
        <div class="comic-container">
            <!-- Panel 1 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <svg class="panel-bg" viewBox="0 0 300 300">
                        <rect width="300" height="300" fill="#fff8dc" />
                        <!-- Character 1 -->
                        <circle cx="80" cy="100" r="25" fill="#f4a460" />
                        <circle cx="80" cy="80" r="30" fill="#f4a460" />
                        <!-- Eyes -->
                        <circle cx="75" cy="75" r="4" fill="#000" />
                        <circle cx="85" cy="75" r="4" fill="#000" />
                        <!-- Mouth -->
                        <path d="M 78 85 Q 80 88 82 85" stroke="#000" stroke-width="2" fill="none" />
                        <!-- Body -->
                        <rect x="70" y="110" width="20" height="40" fill="#4169e1" />
                        <!-- Arms -->
                        <line x1="70" y1="120" x2="45" y2="110" stroke="#f4a460" stroke-width="8" />
                        <line x1="90" y1="120" x2="115" y2="110" stroke="#f4a460" stroke-width="8" />
                    </svg>
                </div>
                <div class="speech-bubble">
                    <p>Wow! What an amazing day for adventure!</p>
                </div>
            </div>

            <!-- Panel 2 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <svg class="panel-bg" viewBox="0 0 300 300">
                        <rect width="300" height="300" fill="#e6f2ff" />
                        <!-- Character 2 -->
                        <circle cx="150" cy="100" r="25" fill="#ff69b4" />
                        <circle cx="150" cy="80" r="30" fill="#ff69b4" />
                        <!-- Eyes (excited) -->
                        <circle cx="145" cy="75" r="5" fill="#000" />
                        <circle cx="155" cy="75" r="5" fill="#000" />
                        <!-- Mouth -->
                        <path d="M 148 85 Q 150 90 152 85" stroke="#000" stroke-width="2" fill="none" />
                        <!-- Body -->
                        <rect x="140" y="110" width="20" height="40" fill="#9370db" />
                        <!-- Arms up -->
                        <line x1="140" y1="120" x2="115" y2="90" stroke="#ff69b4" stroke-width="8" />
                        <line x1="160" y1="120" x2="185" y2="90" stroke="#ff69b4" stroke-width="8" />
                    </svg>
                </div>
                <div class="speech-bubble">
                    <p>I'm coming with you!</p>
                </div>
            </div>

            <!-- Panel 3 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <svg class="panel-bg" viewBox="0 0 300 300">
                        <rect width="300" height="300" fill="#ffe4e1" />
                        <!-- Danger obstacle -->
                        <polygon points="150,50 200,150 100,150" fill="#ff4500" />
                        <text x="150" y="120" font-size="40" text-anchor="middle" fill="#fff"
                            font-weight="bold">!</text>
                        <!-- Both characters surprised -->
                        <circle cx="50" cy="200" r="20" fill="#f4a460" />
                        <circle cx="50" cy="185" r="25" fill="#f4a460" />
                        <circle cx="250" cy="200" r="20" fill="#ff69b4" />
                        <circle cx="250" cy="185" r="25" fill="#ff69b4" />
                        <!-- Shocked faces -->
                        <circle cx="45" cy="180" r="4" fill="#000" />
                        <circle cx="55" cy="180" r="4" fill="#000" />
                        <circle cx="245" cy="180" r="4" fill="#000" />
                        <circle cx="255" cy="180" r="4" fill="#000" />
                    </svg>
                </div>
                <div class="speech-bubble">
                    <p>Oh no! A volcano!</p>
                </div>
            </div>

            <!-- Panel 4 -->
            <div class="comic-panel">
                <div class="panel-content">
                    <svg class="panel-bg" viewBox="0 0 300 300">
                        <rect width="300" height="300" fill="#fff" />
                        <!-- Flying characters -->
                        <circle cx="100" cy="100" r="25" fill="#f4a460" />
                        <circle cx="100" cy="80" r="30" fill="#f4a460" />
                        <!-- Wings -->
                        <path d="M 75 90 Q 50 80 70 100" stroke="#ffd700" stroke-width="8" fill="none" />
                        <path d="M 125 90 Q 150 80 130 100" stroke="#ffd700" stroke-width="8" fill="none" />

                        <circle cx="200" cy="120" r="25" fill="#ff69b4" />
                        <circle cx="200" cy="100" r="30" fill="#ff69b4" />
                        <!-- Wings -->
                        <path d="M 175 110 Q 150 100 170 120" stroke="#ffd700" stroke-width="8" fill="none" />
                        <path d="M 225 110 Q 250 100 230 120" stroke="#ffd700" stroke-width="8" fill="none" />
                    </svg>
                </div>
                <div class="speech-bubble">
                    <p>We did it! Adventure saved the day!</p>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-btn" id="prevBtn">← Previous</button>
            <span class="panel-counter"><span id="currentPanel">1</span> / 4</span>
            <button class="nav-btn" id="nextBtn">Next →</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Comic Strip Adventures. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
